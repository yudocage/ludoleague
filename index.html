<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nothing or All League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #081725;
    --panel: #0f2035;
    --panel-2: #13273f;
    --line: #1f3b5c;
    --text: #eef1f8;
    --muted: #7c8aab;
    --muted-2: #576284;
    --gold: #fac712;
    --red: #fb011e;
    --green: #35c07a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 18px 70px;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(242,183,5,.07), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  /* ---- Logo ---- */
  .logo-wrap { text-align: center; margin-bottom: 14px; }
  .logo-wrap img { max-height: 128px; max-width: 128px; margin: 0 auto; display: block; }
  .logo-placeholder {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 130px;
    height: 56px;
    margin: 0 auto;
    border: 1px dashed var(--line);
    border-radius: 8px;
    color: var(--muted-2);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: .06em;
  }

  header { margin-bottom: 22px; text-align: center; }
  .kicker {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .12em;
    color: var(--gold);
    margin: 0 0 6px;
  }
  h1 {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 32px;
    line-height: 1.05;
    letter-spacing: .01em;
    margin: 0 0 8px;
    text-transform: uppercase;
  }
  .sub { color: var(--muted); font-size: 14px; margin: 0 auto; max-width: 46ch; }

  section { margin-bottom: 30px; }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--line);
  }
  .section-head h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    color: var(--text);
    margin: 0;
  }

  button {
    font-family: 'IBM Plex Sans', sans-serif;
    border: none;
    border-radius: 7px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: filter .12s ease, background .12s ease;
  }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn-gold { background: var(--gold); color: #16130a; }
  .btn-gold:hover { filter: brightness(1.08); }
  .btn-line { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 7px 12px; font-size: 12px; }
  .btn-line:hover { color: var(--text); border-color: var(--muted-2); }
  .btn-danger-line { background: transparent; color: var(--red); border: 1px solid rgba(229,72,77,.35); padding: 7px 12px; font-size: 12px; }
  .btn-danger-line:hover { background: rgba(229,72,77,.08); }
  .btn-rules { background: var(--red); color: #fff; padding: 8px 16px; font-size: 12.5px; }
  .btn-rules:hover { filter: brightness(1.08); }

  .admin-only { display: none !important; }
  body.is-admin .admin-only { display: initial !important; }
  body.is-admin section .admin-only.block { display: block !important; }
  body.is-admin section .admin-only.inline { display: inline-block !important; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
  textarea {
    width: 100%;
    min-height: 120px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13.5px;
    line-height: 1.6;
    resize: vertical;
  }
  textarea::placeholder { color: var(--muted-2); }
  textarea:focus, input:focus { outline: none; border-color: var(--gold); }
  label.opt { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--muted); margin: 14px 0 16px; cursor: pointer; }
  label.opt input { accent-color: var(--gold); width: 15px; height: 15px; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted-2);
    text-align: left;
    padding: 0 8px 10px;
    font-weight: 500;
  }
  th.num, td.num { text-align: center; }
  tbody tr { border-top: 1px solid var(--line); }
  tbody td { padding: 11px 8px; font-size: 14px; }
  td.rank { color: var(--muted-2); font-family: 'IBM Plex Mono', monospace; font-size: 12px; width: 22px; }
  td.name { font-weight: 700; font-size: 14.5px; }
  tbody tr.leader { box-shadow: inset 3px 0 0 var(--gold); }
  tbody tr.leader td.rank { color: var(--gold); }
  td.num { font-family: 'IBM Plex Mono', monospace; color: var(--muted); font-size: 13px; }
  td.pts { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 15px; color: var(--text); }
  tbody tr.leader td.pts { color: var(--gold); }

  .round-block + .round-block { margin-top: 20px; }
  .round-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--muted-2);
    margin-bottom: 8px;
  }
  .match-card {
    border-top: 1px solid var(--line);
    padding: 12px 4px;
  }
  .round-block:first-of-type .match-card:first-child { border-top: none; }
  .match-teams {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .team { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team.away { text-align: right; }
  .team.winner { color: var(--gold); font-weight: 600; }
  .final-score {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    text-align: center;
    min-width: 40px;
  }
  .sets-row { display: flex; justify-content: center; gap: 10px; }
  .set { display: flex; align-items: center; gap: 4px; }
  .set input {
    width: 28px;
    height: 28px;
    text-align: center;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 5px;
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    padding: 0;
  }
  .set input:disabled { color: var(--muted); opacity: .75; cursor: default; }
  .set input::-webkit-outer-spin-button,
  .set input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .set span { color: var(--muted-2); font-family: 'IBM Plex Mono', monospace; font-size: 11px; }

  .empty { text-align: center; padding: 50px 20px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 14px; }
  .empty strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }

  .status { font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .04em; color: var(--muted-2); text-align: center; margin-top: 26px; }
  .status.ok::before { content: '● '; color: var(--green); }
  .status.err::before { content: '● '; color: var(--red); }

  /* ---- Rules modal ---- */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(4,7,16,.72);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px;
    max-width: 480px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    position: relative;
  }
  .modal-box h2 {
    font-family: 'Oswald', sans-serif;
    font-size: 18px;
    text-transform: uppercase;
    letter-spacing: .04em;
    margin: 0 0 14px;
    color: var(--gold);
  }
  .modal-box p { font-size: 14px; line-height: 1.6; color: var(--text); margin: 0 0 10px; }
  .modal-box p strong { color: var(--gold); font-weight: 700; }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    width: 28px;
    height: 28px;
    padding: 0;
    border-radius: 7px;
    font-size: 14px;
    line-height: 1;
  }
  .modal-close:hover { color: var(--text); }

  @media (prefers-reduced-motion: no-preference) {
    .reveal { animation: rise .35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  }
</style>
</head>

const RULES_TEXT = `1. Взнос и призовой фонд
Каждый участник вносит 20 €. Все взносы образуют призовой фонд. Пара-победитель лиги забирает весь фонд целиком. Второго места нет: всё или ничего.

2. Сроки
Лига длится два месяца. Все матчи должны быть сыграны до 30 ноября включительно.

3. Порядок матчей
Матчи проводятся строго по турам. Матч следующего тура можно играть только после того, как сыгран свой матч текущего тура.

4. Организация матча
Пары сами договариваются с соперниками о дате, времени и месте проведения матча.

5. Формат матча
Матч играется до двух выигранных сетов (из трёх). Если после двух сетов счёт 1:1, играется полноценный третий сет по тем же правилам.

6. Счёт в гейме
Счёт внутри гейма как в теннисе: 0, 15, 30, 40, гейм.

При счёте 40:40 действует правило Golden Point: следующее очко решает гейм, «больше» не играется.

Решающую подачу принимает пара, которая принимает в этом гейме. Она сама выбирает, с какой стороны (справа или слева) принимать. Игроки при этом не меняются своими обычными позициями приёма, то есть пара просто выбирает, кто из двоих будет отбивать подачу.

7. Сет и тай-брейк
Сет выигрывает пара, первой взявшая 6 геймов с разницей минимум в 2 гейма.

При счёте 5:5 играются ещё два гейма. Если одна пара выигрывает оба, сет заканчивается со счётом 7:5.

При счёте 6:6 играется тай-брейк. Тай-брейк продолжается, пока одна из пар не наберёт 7 очков или больше с преимуществом минимум в 2 очка. Сет, выигранный на тай-брейке, записывается как 7:6. 

8. Смена сторон
Пары меняются сторонами после 1-го, 3-го и каждого следующего нечётного гейма в сете. В тай-брейке стороны меняются каждые 6 очков.

Если смену сторон пропустили, её делают сразу, как только заметили ошибку. Уже сыгранные очки остаются в силе.

9. Равенство очков
Если по итогам всех матчей несколько пар набрали одинаковое наибольшее число очков, победитель лиги определяется в дополнительных играх.

Посев. Пары, делящие первое место, ранжируются по показателям основной части: сначала по разнице сетов, затем по числу выигранных сетов. Если и эти показатели равны, порядок определяется жребием.

Две пары играют между собой один решающий матч.

Три пары. Пара, лучшая по посеву, сразу выходит в финал. Две другие играют полуфинал, его победитель выходит в финал.

Четыре пары. Играются полуфиналы по схеме 1-я против 4-й и 2-я против 3-й, затем финал между победителями.

Все дополнительные матчи играются по обычным правилам лиги, до двух выигранных сетов.`;

function initFirebase() {
  if (firebaseConfig.apiKey === "ВСТАВЬ_СЮДА") {

function generateRoundRobin(teamNames, doubleRound) {
  let list = teamNames.slice();
  if (list.length % 2 !== 0) list.push(null); // bye
  const n = list.length;
  const rounds = [];
  for (let r = 0; r < n - 1; r++) {
    const roundMatches = [];
    for (let i = 0; i < n / 2; i++) {
      const home = list[i];
      const away = list[n - 1 - i];
      if (home !== null && away !== null) {
        roundMatches.push(r % 2 === 0 ? { home, away } : { home: away, away: home });
      }
    }
    rounds.push(roundMatches);
    const last = list.pop();
    list.splice(1, 0, last);
  }
  let allRounds = rounds;
  if (doubleRound) {
    const secondLeg = rounds.map(round => round.map(m => ({ home: m.away, away: m.home })));
    allRounds = rounds.concat(secondLeg);
  }
  const matches = [];
  let id = 0;
  allRounds.forEach((round, ri) => {
    round.forEach(m => {
      matches.push({ id: 'm' + (id++), round: ri + 1, home: m.home, away: m.away, sets: emptySets() });
    });
  });
  return matches;
}

document.getElementById('generateBtn').addEventListener('click', () => {
  if (!isAdmin) return;
  const raw = document.getElementById('teamsInput').value;
  const teams = raw.split('\n').map(t => t.trim()).filter(Boolean);
  if (teams.length < 2) {
    alert('Добавь минимум 2 команды.');
    return;
  }
  const unique = new Set(teams);
  if (unique.size !== teams.length) {
    alert('Названия команд должны быть уникальными.');
    return;
  }
  const doubleRound = document.getElementById('doubleRound').checked;
  const matches = generateRoundRobin(teams, doubleRound);
  state = { teams, matches, double: doubleRound };
  render();
  saveState();
});

resetBtn.addEventListener('click', () => {
  if (!isAdmin) return;
  if (!confirm('Точно сбросить турнир для всех? Это удалит все матчи и результаты.')) return;
  state = null;
  render();
  saveState();
});

toggleSetupBtn.addEventListener('click', () => {
  setupBody.style.display = setupBody.style.display === 'none' ? 'block' : 'none';
});

/* ---- Rules modal ---- */
const rulesOverlay = document.getElementById('rulesOverlay');
function formatRuleLine(l) {
  const escaped = escapeHtml(l).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const isHeading = /^\d+\.\s+\S/.test(l.trim());
  return isHeading ? `<strong>${escaped}</strong>` : escaped;
}
document.getElementById('rulesText').innerHTML = RULES_TEXT.split('\n').map(l => `<p>${formatRuleLine(l)}</p>`).join('');
document.getElementById('rulesBtn').addEventListener('click', () => rulesOverlay.classList.add('open'));
document.getElementById('rulesClose').addEventListener('click', () => rulesOverlay.classList.remove('open'));
rulesOverlay.addEventListener('click', e => { if (e.target === rulesOverlay) rulesOverlay.classList.remove('open'); });

function setWinner(set) {
  if (set.h === '' || set.a === '' || set.h === undefined || set.a === undefined) return 0;
  const h = Number(set.h), a = Number(set.a);
  if (h > a) return 1;
  if (a > h) return -1;
  return 0;
}

function matchStats(match) {
  let hSets = 0, aSets = 0, hGames = 0, aGames = 0;
  (match.sets || []).forEach(s => {
    const w = setWinner(s);
    if (w === 1) { hSets++; hGames += Number(s.h); aGames += Number(s.a); }
    else if (w === -1) { aSets++; hGames += Number(s.h); aGames += Number(s.a); }
  });
  const decided = hSets >= 2 || aSets >= 2;
  return { hSets, aSets, hGames, aGames, decided };
}

function computeStandings() {
  const table = {};
  state.teams.forEach(t => { table[t] = { pl: 0, w: 0, l: 0, sw: 0, sl: 0, gw: 0, gl: 0, pts: 0 }; });
  state.matches.forEach(m => {
    const { hSets, aSets, hGames, aGames, decided } = matchStats(m);
    if (!decided) return;
    const h = table[m.home], a = table[m.away];
    h.pl++; a.pl++;
    h.sw += hSets; h.sl += aSets;
    a.sw += aSets; a.sl += hSets;
    h.gw += hGames; h.gl += aGames;
    a.gw += aGames; a.gl += hGames;
    if (hSets > aSets) { h.w++; h.pts += 1; a.l++; }
    else { a.w++; a.pts += 1; h.l++; }
  });
  return Object.entries(table)
    .map(([name, s]) => ({ name, ...s, gd: s.gw - s.gl }))
    .sort((x, y) => y.pts - x.pts || y.gd - x.gd || y.gw - x.gw || x.name.localeCompare(y.name));
}

function renderStandings() {
  const standings = computeStandings();
  let html = '<table><thead><tr><th></th><th>Команда</th><th class="num">И</th><th class="num">В</th><th class="num">П</th><th class="num">РГ</th><th class="num">О</th></tr></thead><tbody>';
  standings.forEach((s, i) => {
    html += `<tr class="${i === 0 && s.pl > 0 ? 'leader' : ''}"><td class="rank">${i + 1}</td><td class="name">${escapeHtml(s.name)}</td><td class="num">${s.pl}</td><td class="num">${s.w}</td><td class="num">${s.l}</td><td class="num">${s.gd >= 0 ? '+' : ''}${s.gd}</td><td class="num pts">${s.pts}</td></tr>`;
  });
  html += '</tbody></table>';
  document.getElementById('standingsTable').innerHTML = `<div class="reveal">${html}</div>`;
}

function matchCardHtml(m) {
  const { hSets, aSets, decided } = matchStats(m);
  const homeWin = decided && hSets > aSets;
  const awayWin = decided && aSets > hSets;
  const anyEntered = (m.sets || []).some(s => s.h !== '' || s.a !== '');
  const scoreLabel = anyEntered ? `${hSets}:${aSets}` : '– : –';
  const sets = m.sets && m.sets.length === 3 ? m.sets : emptySets();
  const setsHtml = sets.map((s, i) => `<div class="set">
      <input type="number" min="0" max="7" value="${s.h}" data-id="${m.id}" data-set="${i}" data-side="h" ${isAdmin ? '' : 'disabled'}>
      <span>:</span>
      <input type="number" min="0" max="7" value="${s.a}" data-id="${m.id}" data-set="${i}" data-side="a" ${isAdmin ? '' : 'disabled'}>
    </div>`).join('');
  return `<div class="match-card" id="match-${m.id}">
    <div class="match-teams">
      <span class="team home${homeWin ? ' winner' : ''}">${escapeHtml(m.home)}</span>
      <span class="final-score">${scoreLabel}</span>
      <span class="team away${awayWin ? ' winner' : ''}">${escapeHtml(m.away)}</span>
    </div>
    <div class="sets-row">${setsHtml}</div>
  </div>`;
}

function updateMatchDisplay(match) {
  const row = document.getElementById('match-' + match.id);
  if (!row) return;
  const { hSets, aSets, decided } = matchStats(match);
  const homeWin = decided && hSets > aSets;
  const awayWin = decided && aSets > hSets;
  const anyEntered = (match.sets || []).some(s => s.h !== '' || s.a !== '');
  row.querySelector('.final-score').textContent = anyEntered ? `${hSets}:${aSets}` : '– : –';
  row.querySelector('.team.home').classList.toggle('winner', homeWin);
  row.querySelector('.team.away').classList.toggle('winner', awayWin);
}

function render() {
  if (!state || !state.teams || !state.teams.length) {
    setupCard.style.display = isAdmin ? 'block' : 'none';
    setupBody.style.display = 'block';
    toggleSetupBtn.style.display = 'none';
    standingsCard.style.display = 'none';
    fixturesCard.style.display = 'none';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';
  setupCard.style.display = isAdmin ? 'block' : 'none';
  setupBody.style.display = 'none';
  toggleSetupBtn.style.display = isAdmin ? 'inline-block' : 'none';
  standingsCard.style.display = 'block';
  fixturesCard.style.display = 'block';
  resetBtn.style.display = isAdmin ? 'inline-block' : 'none';

  renderStandings();

  const byRound = {};
  state.matches.forEach(m => {
    byRound[m.round] = byRound[m.round] || [];
    byRound[m.round].push(m);
  });
  let fhtml = '';
  Object.keys(byRound).sort((a, b) => a - b).forEach(r => {
    fhtml += `<div class="round-block"><div class="round-title">Тур ${r}</div>`;
    byRound[r].forEach(m => { fhtml += matchCardHtml(m); });
    fhtml += '</div>';
  });
  document.getElementById('fixturesList').innerHTML = `<div class="reveal">${fhtml}</div>`;

  document.querySelectorAll('.set input').forEach(inp => {
    inp.addEventListener('input', e => {
      if (!isAdmin) return;
      const id = e.target.getAttribute('data-id');
      const setIdx = Number(e.target.getAttribute('data-set'));
      const side = e.target.getAttribute('data-side');
      const match = state.matches.find(m => m.id === id);
      if (!match) return;
      if (!match.sets || match.sets.length !== 3) match.sets = emptySets();
      match.sets[setIdx][side] = e.target.value;
      updateMatchDisplay(match);
      renderStandings();
      saveState();
    });
  });
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

initFirebase();
</script>
